<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cyber Tracking System</title>
<style>
body {
    margin: 0;
    background: black;
    color: #00ff88;
    font-family: "Courier New", monospace;
    overflow: hidden;
}

canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

.container {
    text-align: center;
    padding-top: 50px;
}

.card {
    background: rgba(0, 0, 0, 0.8);
    border: 1px solid #00ff88;
    display: inline-block;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 20px #00ff88;
}

input, button {
    background: black;
    border: 1px solid #00ff88;
    color: #00ff88;
    padding: 8px;
    margin: 5px;
}

button:hover {
    background: #00ff88;
    color: black;
}

.progress {
    width: 100%;
    background: #003322;
    margin-top: 10px;
}

.progress-bar {
    width: 0%;
    height: 10px;
    background: #00ff88;
}

img {
    margin-top: 10px;
    max-width: 150px;
    border: 1px solid #00ff88;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<div class="container">
    <div class="card">
        <h2>CYBER TRACKING SYSTEM v3.7</h2>
        <input type="text" id="targetName" placeholder="Masukkan Nama Target (Fiksi)">
        <br>
        <input type="file" id="photoInput" accept="image/*">
        <br>
        <button onclick="startScan()">INITIATE SCAN</button>

        <div class="progress">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <p id="status"></p>
        <img id="preview" />
    </div>
</div>

<script>
// Matrix Effect
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");

canvas.height = window.innerHeight;
canvas.width = window.innerWidth;

const letters = "01";
const fontSize = 14;
const columns = canvas.width / fontSize;
const drops = [];

for (let x = 0; x < columns; x++)
    drops[x] = 1;

function drawMatrix() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#00ff88";
    ctx.font = fontSize + "px monospace";

    for (let i = 0; i < drops.length; i++) {
        const text = letters[Math.floor(Math.random() * letters.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975)
            drops[i] = 0;
        drops[i]++;
    }
}
setInterval(drawMatrix, 33);

// Preview image
document.getElementById("photoInput").addEventListener("change", function(e){
    const reader = new FileReader();
    reader.onload = function(){
        document.getElementById("preview").src = reader.result;
    }
    reader.readAsDataURL(e.target.files[0]);
});

// Fake scan simulation
function startScan() {
    let progress = 0;
    const bar = document.getElementById("progressBar");
    const status = document.getElementById("status");
    const name = document.getElementById("targetName").value || "UNKNOWN TARGET";

    status.innerText = "Initializing scan for: " + name;

    const interval = setInterval(() => {
        progress += 5;
        bar.style.width = progress + "%";

        if (progress >= 100) {
            clearInterval(interval);
            status.innerText = "SCAN COMPLETE ✔ Location: ACCESS DENIED (Simulation Mode)";
        }
    }, 200);
}
</script>

</body>
</html>
